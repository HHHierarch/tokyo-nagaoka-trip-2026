function overviewContent() {

  DAYS.forEach(function(d){ d.locations.forEach(function(l){ if(l.budget&&l.budget!=='已购'){ var m=l.budget.match(/¥([0-9,]+)/); if(m) total+=parseInt(m[1].replace(/,/g,'')); }}); });
  return '<div class="hero"><h1>东京 8日 · 乐器 + JDM + 富士</h1><p class="subtitle">8/2-8/9 · 2人行 · 乐器 · 中古 · JDM · 富士</p></div>'+
'<div class="info-grid">'+
'<div class="info-card"><div class="label">酒店</div><div class="value">FRESA INN<br>上野御徒町<br><span style="font-size:12px;color:var(--text-secondary)">6晚+河口湖1晚</span></div></div>'+
'<div class="info-card"><div class="label">航班</div><div class="value">NH924 14:15-19:45<br>NH923 09:15-13:05<br><span style="font-size:11px">经济舱 3,650/人</span></div></div>'+
'<div class="info-card"><div class="label">交通卡</div><div class="value">Suica<br>iPhone钱包添加<br><span style="font-size:11px">JR/地铁/便利店</span></div></div>'+
'<div class="info-card"><div class="label">预估/人</div><div class="value">约 ¥'+total.toLocaleString()+'<br>≈ ¥'+Math.round(total/EXRATE).toLocaleString()+'<br><span style="font-size:11px">含住·行·票·食</span></div></div>'+
'</div>'+
'<div class="section-head">行程概览</div>'+
'<div class="day-list">'+DAYS.slice(1).map(function(d){ return '<div class="card" onclick="go('+d.id+')"><div class="name"><span class="dot" style="background:'+d.color+'"></span>'+d.label+' · '+d.title+'</div><div class="desc">'+d.date+'</div></div>'; }).join('')+'</div>'+
'<div class="section-head">支付提醒</div>'+
'<div class="pay-summary"><h4>现金</h4><p>小餐馆、寺庙、黄金街大多只收现金 · 建议备 ¥30,000-50,000 / ¥1,250-2,090</p></div>'+
'<div class="pay-summary"><h4>信用卡</h4><p class="ok-text">酒店、百货、连锁店、新干线可用 Visa/Master/JCB</p></div>'+
'<div class="pay-summary"><h4>Suica</h4><p class="ok-text">iPhone钱包直接添加 · 地铁/JR/便利店通用</p></div>'+
'<div class="pay-summary"><h4 class="warn">Bass托运</h4><p class="warn">提前打ANA确认超大件 · 提前3h到机场</p></div>'+
'<div class="section-head">图例</div>'+
'<div class="legend"><div class="legend-item"><div class="legend-dot" style="background:var(--tint-red)"></div>餐厅</div><div class="legend-item"><div class="legend-dot" style="background:var(--tint-blue)"></div>景点</div><div class="legend-item"><div class="legend-dot" style="background:var(--tint-purple)"></div>酒吧</div><div class="legend-item"><div class="legend-dot" style="background:var(--tint-orange)"></div>酒店</div></div>';
}

// ══════════  ENGINE  ══════════
const map = L.map('map', { center: [HOTEL.lat||35.69, HOTEL.lng||139.74], zoom: 12, zoomControl: false, attributionControl: true });
L.control.zoom({ position: 'topright' }).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);

const LocateControl = L.Control.extend({ options: { position: 'bottomright' }, onAdd() { const b = L.DomUtil.create('button', 'locate-btn'); b.innerHTML = 'P'; b.title = '我的位置'; L.DomEvent.disableClickPropagation(b); b.addEventListener('click', function(){ b.classList.add('active'); map.locate({ setView: true, maxZoom: 15 }); }); return b; } });
new LocateControl().addTo(map);
let locMarker, locCircle;
map.on('locationfound', function(e){ var r=e.accuracy/2; if(locMarker){ locMarker.setLatLng(e.latlng); locCircle.setLatLng(e.latlng).setRadius(r); } else { locMarker=L.marker(e.latlng,{ icon:L.divIcon({ className:'', html:'<div style="width:14px;height:14px;border-radius:50%;background:#007aff;border:2.5px solid #fff;box-shadow:0 0 6px rgba(0,122,255,.5)"></div><div class="loc-pulse" style="position:absolute;top:0;left:0"></div>', iconSize:[14,14], iconAnchor:[7,7] }), zIndexOffset:2000 }).addTo(map); locCircle=L.circle(e.latlng,{ radius:r, color:'#007aff', fillColor:'#007aff', fillOpacity:.08, weight:1 }).addTo(map); } });
map.on('locationerror', function(){});

function icon(c, emoji){ return L.divIcon({ className:'', html:'<div style="width:28px;height:28px;border-radius:50%;background:'+c+';border:2.5px solid #fff;display:flex;align-items:center;justify-content:center;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.18)">'+(emoji||'')+'</div>', iconSize:[28,28], iconAnchor:[14,14], popupAnchor:[0,-16] }); }
if(HOTEL.lat) L.marker([HOTEL.lat, HOTEL.lng], { icon: icon('#ff9500','H'), zIndexOffset:1000 }).addTo(map).bindPopup('<b>'+HOTEL.name+'</b>');

let markers=[], polylines=[];
const emojis={ food:'F', spot:'S', hotel:'H', transport:'T', drink:'D' };

function clearMap(){ markers.forEach(function(m){ map.removeLayer(m); }); polylines.forEach(function(p){ map.removeLayer(p); }); markers=[]; polylines=[]; }

function showDay(idx){
  clearMap();
  if(idx===0){
    var pts=[];
    DAYS.forEach(function(d){ d.locations.forEach(function(l){ if(l.lat) pts.push([l.lat,l.lng]); }); });
    if(pts.length) map.fitBounds(pts,{ padding:[30,30] });
    DAYS.slice(1).forEach(function(d){
      d.locations.filter(function(l){ return l.time!=='—'; }).forEach(function(l){
        var m=L.circleMarker([l.lat,l.lng],{ radius:4, fillColor:d.color, color:'#fff', weight:1.5, fillOpacity:.9 }).addTo(map).bindPopup('<b>'+l.name+'</b><br><span style="color:#86868b">'+d.label+'</span>');
        markers.push(m);
      });
    });
    return;
  }
  var day=DAYS.find(function(d){ return d.id===idx; });
  if(!day) return;
  var coords=[];
  day.locations.forEach(function(l){
    if(!l.lat) return;
    var m=L.marker([l.lat,l.lng],{ icon: icon(day.color, emojis[l.type]||'M') }).addTo(map);
    var gq=l.gmap||encodeURIComponent(l.name+' Tokyo');
    m.bindPopup('<b>'+l.name+'</b>'+(l.time!=='—'?'<br><span style="color:#86868b">'+l.time+'</span>':'')+'<br>'+l.desc+(l.budget?'<br><span style="color:#ff9500">'+l.budget+'</span>':'')+'<br><a href="#" onclick="event.preventDefault();openAS(\''+l.name.replace(/'/g,"\\'")+'\','+l.lat+','+l.lng+',\''+gq+'\')">导航</a>');
    markers.push(m);
    if(l.time!=='—') coords.push([l.lat,l.lng]);
  });
  if(coords.length>1){ var pl=L.polyline(coords,{ color:day.color, weight:2.5, opacity:.5, dashArray:'6,5' }).addTo(map); polylines.push(pl); }
  if(coords.length) map.fitBounds(coords,{ padding:[40,40], maxZoom:14 });
}

function payChips(pay){ if(!pay) return ''; var h='<div class="pays">'; var m={ cash:'现金', card:'卡', suica:'Suica', paypay:'PayPay', alipay:'支付宝', wechat:'微信' }; for(var k in m){ if(pay[k]!==undefined){ var c=pay[k]===1?'ok':pay[k]===0.5?'idk':'no'; h+='<span class="pay '+c+'">'+m[k]+'</span>'; } } return h+'</div>'; }

const IN_APP=!!((navigator.userAgent||'').toLowerCase().match(/micromessenger|xhs|xhsdiscover|tiktok|aweme|weibo|qq\/|alipayclient|dingtalk|lark|feishu|ucbrowser|baiduboxapp|toutiao|newsarticle/));

function locCard(loc, dayIdx){
  var dot=loc.type==='food'?'food':loc.type==='spot'?'spot':loc.type==='drink'?'drink':loc.type==='hotel'?'hotel':'transport';
  var bdg=loc.type==='food'?'<span class="badge food">餐</span>':loc.type==='spot'?'<span class="badge spot">景</span>':loc.type==='drink'?'<span class="badge drink">饮</span>':'';
  var gq=loc.gmap||encodeURIComponent(loc.name+' Tokyo');
  var lnk='<button class="btn nav" onclick="openAS(\''+loc.name.replace(/'/g,"\\'")+'\','+loc.lat+','+loc.lng+',\''+gq+'\')">导航</button>';
  if(loc.reserve) lnk+='<a href="'+loc.reserve+'" target="_blank" class="btn rsv">预约</a>';
  return '<div class="tl-item"><div class="tl-dot '+dot+'"></div><div class="card"><div class="time">'+(loc.time!=='—'?loc.time:'备选')+'</div><div class="name">'+bdg+' '+loc.name+'</div><div class="desc">'+loc.desc+'</div>'+(loc.budget?'<div class="budget">'+loc.budget+' (日元/人民币)</div>':'')+payChips(loc.pay)+'<div class="links">'+lnk+'</div></div></div>';
}

function renderDay(idx){
  var d=DAYS.find(function(x){ return x.id===idx; }); if(!d) return '';
  var main=d.locations.filter(function(l){ return l.time!=='—'; });
  var alt=d.locations.filter(function(l){ return l.time==='—'; });
  var h='<div class="day-head"><h2>'+d.title+'</h2><p>'+d.date+'</p></div>';
  if(main.length){ h+='<div class="section-head">行程</div><div class="timeline">'; main.forEach(function(l){ h+=locCard(l,idx); }); h+='</div>'; }
  if(alt.length){ h+='<div class="section-head">备选</div><div class="timeline">'; alt.forEach(function(l){ h+=locCard(l,idx); }); h+='</div>'; }
  return h;
}

var cur=0;
const tabsEl=document.getElementById('tabs'), contentEl=document.getElementById('content');
DAYS.forEach(function(d){ var b=document.createElement('button'); b.className='tab'+(d.id===0?' active':''); b.dataset.day=d.id; b.textContent=d.label; tabsEl.appendChild(b); });

function go(idx){
  cur=idx;
  tabsEl.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('active', +t.dataset.day===idx); });
  contentEl.innerHTML=idx===0?overviewContent():renderDay(idx);
  showDay(idx);
  contentEl.scrollTo({top:0});
  var tab=tabsEl.querySelector('[data-day="'+idx+'"]');
  if(tab) tab.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
}

tabsEl.addEventListener('click',function(e){ var t=e.target.closest('.tab'); if(t) go(+t.dataset.day); });
go(0);

const asOverlay=document.createElement('div'); asOverlay.className='as-overlay';
asOverlay.innerHTML='<div class="as-sheet"><div class="as-group" id="as-opts"></div><div class="as-group"><button class="as-item as-cancel" onclick="closeAS()">取消</button></div></div>';
document.body.appendChild(asOverlay);
asOverlay.addEventListener('click',function(e){ if(e.target===asOverlay) closeAS(); });

const IS_IOS=/iPad|iPhone|iPod/.test(navigator.userAgent);
function openAS(name, lat, lng, gmap){
  var q=gmap||encodeURIComponent(name+' Tokyo');
  var en=encodeURIComponent(name);
  var sn=name.replace(/'/g,"\\'");
  var au=IN_APP?'https://maps.apple.com/?q='+lat+','+lng+'&ll='+lat+','+lng+'&name='+en:'maps://maps.apple.com/?q='+lat+','+lng+'&name='+en;
  var gu='https://www.google.com/maps/search/?api=1&query='+q;
  document.getElementById('as-opts').innerHTML='<button class="as-item" onclick="window.open(\''+au+'\');closeAS()">Apple Maps</button><button class="as-item" onclick="window.open(\''+gu+'\');closeAS()">Google Maps</button><button class="as-item" onclick="window.open(\''+(IN_APP?'https://uri.amap.com/marker?position='+lng+','+lat+'&name='+en+'&src=trip&coordinate=wgs84&callnative=1':(IS_IOS?'iosamap':'androidamap')+'://viewMap?sourceApplication=trip&poiname='+en+'&lat='+lat+'&lon='+lng+'&dev=0')+'\');closeAS()">高德地图</button>';
  asOverlay.classList.add('show');
}
function closeAS(){ asOverlay.classList.remove('show'); }
</script>
